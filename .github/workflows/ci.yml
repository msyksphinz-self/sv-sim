# sv-sim CI (docs/milestones/M0/plan.md §6、タスク M0-T2)。
#
# - サードパーティの action はコミット SHA で固定し、コメントにタグを書く (決定 U-5)。
#   SHA は各リポジトリのタグから `git ls-remote --tags` で確認した (2026-11-27)。
# - ツールチェーンは rust-toolchain.toml に従う (rustup がファイルを読んで導入する)。
# - M0 は Linux (ubuntu-latest) だけで回す。
# - push はすべてのブランチで回す (作業ブランチで PR を作らずに開発するため。M0-T15 のマネージャ決定)。
#   pull_request も回すので、PR のあるブランチでは同じコミットが push と pull_request の両方で回る
#   (concurrency のグループはイベント名を含むので、互いに取り消し合わない)。
# - main 以外では、新しい実行が来たら古い実行を取り消す。main では取り消さない (全コミットの結果を残す)。

name: CI

on:
  push:
  pull_request:
  schedule:
    # proptest-long を毎日 (UTC 18:00 = JST 03:00) 実行する
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - run: cargo fmt --all -- --check

  clippy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked
      # proptest は既定の件数。コーパスのテストは一時ディレクトリの file:// リポジトリを使い、ネットワークに出ない
      - run: cargo test --workspace --locked

  doc:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      # cargo-deny の版も固定する
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
      # 許可するライセンスなどは deny.toml (R-25)
      - run: cargo deny --locked check licenses bans sources

  proptest-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: proptest (100000 cases)
        run: cargo test -p svsim-logic --release --locked
        env:
          PROPTEST_CASES: "100000"
      - name: Wide-value smoke tests (#[ignore])
        run: cargo test -p svsim-logic --release --locked -- --ignored

  # コーパスの取得と列挙 (plan.md §6, §7、タスク M0-T13、TC82)。
  # sv-tests を固定コミットで取得し、ケースを列挙する。キャッシュのキーはマニフェストのハッシュ。
  # 手動起動 (workflow_dispatch) でも動かす (M0-T15、TC82 の確認用)。
  corpus-fetch:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set corpus cache directory
        run: echo "SVSIM_CORPUS_CACHE=$HOME/.cache/svsim/corpus" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/svsim/corpus
          key: corpus-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      # Cargo.lock を変えないことを --locked で確かめてから、エイリアス (`cargo corpus`) で動かす
      - run: cargo build -p svsim-corpus --locked
      - run: cargo corpus fetch sv-tests
      - run: cargo corpus discover sv-tests
