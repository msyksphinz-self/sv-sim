[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"

[workspace.lints.rust]
# clippy -D warnings と組み合わせて実質エラーにする。公開 API の doc コメントは必須 (CLAUDE.md §3)
missing_docs = "warn"
# forbid にしない (plan-review R-1: tests/no_alloc*.rs で allow できなくなるため)。
# 各 crate の lib.rs / main.rs の #![forbid(unsafe_code)] で締める。
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# M0 で使う全依存をここで固定する (plan.md §2.2)。以降のタスクは依存を追加しない。
# ライセンスは Apache-2.0/MIT 互換に限る。
[workspace.dependencies]
# workspace 内の crate
svsim-common = { path = "crates/svsim-common", version = "0.1.0" }
svsim-logic = { path = "crates/svsim-logic", version = "0.1.0" }
svsim-logic-ref = { path = "crates/svsim-logic-ref", version = "0.1.0" }
svsim-corpus = { path = "crates/svsim-corpus", version = "0.1.0" }

# 外部 crate
clap = { version = "4.6.10", features = ["derive"] }        # MIT OR Apache-2.0
num-bigint = "0.5.1"                                          # MIT OR Apache-2.0
num-traits = "0.2.19"                                         # MIT OR Apache-2.0
proptest = "1.12.0"                                           # MIT OR Apache-2.0
rustc-hash = "2.1.3"                                          # MIT OR Apache-2.0
serde = { version = "1.0.229", features = ["derive"] }       # MIT OR Apache-2.0
serde_json = "1.0.154"                                        # MIT OR Apache-2.0
tempfile = "3.27.0"                                           # MIT OR Apache-2.0
toml = "1.2.3"                                                # MIT OR Apache-2.0
walkdir = "2.5.1"                                             # Unlicense OR MIT
